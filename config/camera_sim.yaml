/**:
  ros__parameters:
    camera:
      # =====================================================================
      # D435i 相机内参配置 (仿真环境)
      # 与 Gazebo 中配置的参数一致:
      #   - 分辨率：1280x720
      #   - 水平 FOV: 87° (1.211 rad)
      #
      # 内参计算:
      #   fx = width / (2 * tan(fov/2))
      #      = 1280 / (2 * tan(1.211/2))
      #      ≈ 906.5
      #   fy ≈ fx (方形像素)
      #   cx = width / 2 = 640
      #   cy = height / 2 = 360
      #
      # 仿真环境中相机无畸变，所以 d0-d3 = 0
      # =====================================================================
      model: Pinhole
      width: 1280
      height: 720
      scale: 0.5
      fx: 906.496337890625
      fy: 906.1392822265625
      cx: 640.511962890625
      cy: 372.7534484863281
      d0: 0.0
      d1: 0.0
      d2: 0.0
      d3: 0.0
